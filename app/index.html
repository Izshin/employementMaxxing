<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ofertas — EmploymentMaxxing</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo">IFL</span>
      <div>
        <h1>Mis candidaturas</h1>
        <p id="clock">—</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn btn--ghost btn-icon theme-toggle" id="btn-theme" type="button" aria-label="Cambiar tema">
      <svg class="theme-toggle__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path class="theme-toggle__moon" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" fill="currentColor" />
        <g class="theme-toggle__sun" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2" />
          <line x1="12" y1="1.5" x2="12" y2="3.7" />
          <line x1="12" y1="20.3" x2="12" y2="22.5" />
          <line x1="1.5" y1="12" x2="3.7" y2="12" />
          <line x1="20.3" y1="12" x2="22.5" y2="12" />
          <line x1="4.6" y1="4.6" x2="6.1" y2="6.1" />
          <line x1="17.9" y1="17.9" x2="19.4" y2="19.4" />
          <line x1="4.6" y1="19.4" x2="6.1" y2="17.9" />
          <line x1="17.9" y1="6.1" x2="19.4" y2="4.6" />
        </g>
      </svg>
    </button>
  </header>

  <main class="app-main">

    <section id="view-list" class="view">
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <div class="toolbar-actions">
          <input id="search" class="input" type="search" placeholder="Buscar..." />
          <button class="btn btn--primary" id="btn-new">+ Nueva oferta</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>No hay ofertas que encajen con el filtro.</p>

      <div class="data-actions">
        <button class="btn btn--ghost" id="btn-save-all">Guardar estado y configuración</button>
        <button class="btn btn--ghost" id="btn-export">Exportar JSON</button>
        <button class="btn btn--ghost" id="btn-import">Importar JSON</button>
        <button class="btn btn--ghost" id="btn-reset">Restaurar ejemplos</button>
        <input type="file" id="file-import" accept="application/json" hidden />
      </div>
    </section>

    <section id="view-detail" class="view" hidden></section>

  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
